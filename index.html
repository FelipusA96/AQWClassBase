<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQW Builds & Encantamentos</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        :root {
            --bg-color: #1a1a24;
            --card-bg: #2d2d3f;
            --text-color: #e0e0e0;
            --gold: #d4af37;
            --gold-hover: #b5952f;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        h1 {
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .header-actions { margin-top: 15px; }

        .btn-suggest {
            background-color: var(--gold);
            color: #111;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-suggest:hover {
            background-color: var(--gold-hover);
            transform: scale(1.05);
        }

        .search-container {
            text-align: center;
            margin-bottom: 30px;
        }

        #searchInput {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            border-radius: var(--border-radius);
            border: 1px solid #444;
            background-color: #111;
            color: white;
            font-size: 16px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .class-card {
            background-color: var(--card-bg);
            border-left: 5px solid var(--gold);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .class-title {
            font-size: 1.5em;
            color: var(--gold);
            margin-top: 0;
            margin-bottom: 10px; /* Reduzido um pouco para dar espaço ao selo */
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        /* ESTILO DO SELO (BADGE) DE FUNÇÃO */
        .role-badge {
            display: inline-block;
            background-color: #4a4a6a;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-bottom: 15px;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            align-self: flex-start;
        }

        .enhancement-list {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            flex-grow: 1;
        }

        .enhancement-list li { margin-bottom: 8px; }
        .enhancement-list strong { color: #aaa; display: inline-block; width: 70px; }

        .notes {
            background-color: #313145;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85em;
            color: #ccc;
            margin-bottom: 15px;
            border-left: 3px solid #666;
        }

        .author {
            font-size: 0.8em;
            color: #888;
            text-align: right;
            margin-top: auto;
            border-top: 1px dashed #444;
            padding-top: 8px;
        }
        
        /* ESTILOS DO MODAL E FORMULÁRIO NATIVO */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 500px;
            border-radius: var(--border-radius);
            padding: 30px;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            color: #aaa;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-content h2 {
            color: var(--gold);
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
            font-size: 0.9em;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #111;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            height: 80px;
        }

        #submitStatus {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }

        .status-success { background-color: #2b542c; color: #a3d9a5; }
        .status-loading { background-color: #665500; color: #ffd700; }
        .status-error { background-color: #542b2b; color: #d9a3a3; }
    </style>
</head>
<body>

    <header>
        <h1>AQW Class Builds</h1>
        <p>Base Comunitária de Encantamentos</p>
        <div class="header-actions">
            <button class="btn-suggest" onclick="openModal()">Sugerir uma Build</button>
        </div>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Buscar por classe, função ou autor...">
    </div>

    <div id="loading" style="text-align: center; color: var(--gold);">Invocando dados...</div>
    <div class="grid-container" id="buildsContainer"></div>

    <!-- FORMULÁRIO NATIVO -->
    <div class="modal-overlay" id="suggestModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal(event)">&times;</button>
            <h2>Enviar Nova Build</h2>
            
            <form id="buildForm" onsubmit="submitForm(event)">
                <div class="form-group">
                    <label>Classe (Ex: Void Highlord)</label>
                    <input type="text" id="input_class" required>
                </div>
                
                <!-- NOVO CAMPO: FUNÇÃO -->
                <div class="form-group">
                    <label>Função (Ex: Farm, Solo, Suporte, PvP)</label>
                    <input type="text" id="input_funcao" required>
                </div>

                <div class="form-group">
                    <label>Encantamento da Classe (Ex: Luck)</label>
                    <input type="text" id="input_classEnh" required>
                </div>
                <div class="form-group">
                    <label>Arma (Ex: Valiance)</label>
                    <input type="text" id="input_weapon" required>
                </div>
                <div class="form-group">
                    <label>Capuz (Ex: Forge)</label>
                    <input type="text" id="input_helm" required>
                </div>
                <div class="form-group">
                    <label>Capa (Ex: Lament)</label>
                    <input type="text" id="input_cape" required>
                </div>
                <div class="form-group">
                    <label>Observação / Dica de uso</label>
                    <textarea id="input_obs" required></textarea>
                </div>
                <div class="form-group">
                    <label>Seu Nick/Nome</label>
                    <input type="text" id="input_author" required>
                </div>
                
                <button type="submit" class="btn-suggest" style="width: 100%;">Enviar para Análise</button>
                <div id="submitStatus"></div>
            </form>
        </div>
    </div>

    <script>
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR9UXKRHsFz1G2hrPf591ArVykTdhaG5oU93Jnb43UjK0QIVx_AL6g5lClynkEXPAZhOkyZ2g9B8GYH/pub?output=csv";
        let allClasses = [];

        window.addEventListener('DOMContentLoaded', () => {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    allClasses = results.data.filter(row => row['Class'] && row['Class'].trim() !== "");
                    document.getElementById('loading').style.display = 'none';
                    renderCards(allClasses);
                }
            });
        });

        function renderCards(classesData) {
            const container = document.getElementById('buildsContainer');
            container.innerHTML = ""; 
            
            if (classesData.length === 0) {
                container.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>Nenhuma classe encontrada.</p>";
                return;
            }

            classesData.forEach(cls => {
                const card = document.createElement('div');
                card.className = 'class-card';
                
                // Resgata a Função da planilha (se estiver vazio, exibe 'Geral')
                const funcao = cls['Função'] || 'Geral';

                card.innerHTML = `
                    <h2 class="class-title">${cls['Class']}</h2>
                    
                    <!-- Selo/Badge de Função -->
                    <div class="role-badge">${funcao}</div>

                    <ul class="enhancement-list">
                        <li><strong>Class:</strong> ${cls['Class Enhan'] || '-'}</li>
                        <li><strong>Weapon:</strong> ${cls['Weapon'] || '-'}</li>
                        <li><strong>Helm:</strong> ${cls['Helm'] || '-'}</li>
                        <li><strong>Cape:</strong> ${cls['Cape'] || '-'}</li>
                    </ul>
                    ${cls['Observação'] ? \`<div class="notes">💡 ${cls['Observação']}</div>\` : ''}
                    ${cls['Autor'] ? \`<div class="author">👤 Autor: ${cls['Autor']}</div>\` : ''}
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allClasses.filter(cls => 
                // Adicionada a 'Função' na pesquisa
                `${cls['Class']} ${cls['Função']} ${cls['Observação']} ${cls['Autor']}`.toLowerCase().includes(searchTerm)
            );
            renderCards(filtered);
        });

        function openModal() {
            document.getElementById('suggestModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
            document.getElementById('submitStatus').style.display = 'none';
        }

        function closeModal(event) {
            if(event) event.stopPropagation();
            document.getElementById('suggestModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function submitForm(event) {
            event.preventDefault(); 
            
            const statusDiv = document.getElementById('submitStatus');
            statusDiv.style.display = 'block';
            statusDiv.className = 'status-loading';
            statusDiv.innerText = 'Enviando sugestão...';

            const formURL = "https://docs.google.com/forms/d/e/1FAIpQLScfsZdbDEOtq1xcbzej_SN0WoGiecnGia710JKdpUb6EpjbYA/formResponse";

            const formData = new URLSearchParams();
            
            // ⚠️ ATENÇÃO AQUI: Substitua pelos entry.IDs que você descobriu!
            formData.append("entry.111111111", document.getElementById('input_class').value);
            formData.append("entry.NOVO_ID_AQUI", document.getElementById('input_funcao').value); // ID do novo campo de Função
            formData.append("entry.222222222", document.getElementById('input_classEnh').value);
            formData.append("entry.333333333", document.getElementById('input_weapon').value);
            formData.append("entry.444444444", document.getElementById('input_helm').value);
            formData.append("entry.555555555", document.getElementById('input_cape').value);
            formData.append("entry.666666666", document.getElementById('input_obs').value);
            formData.append("entry.777777777", document.getElementById('input_author').value);

            fetch(formURL, {
                method: "POST",
                mode: "no-cors", 
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            }).then(() => {
                statusDiv.className = 'status-success';
                statusDiv.innerText = 'Build enviada com sucesso! Ela será analisada.';
                document.getElementById('buildForm').reset();
                setTimeout(() => closeModal(), 3000); 
            }).catch(error => {
                statusDiv.className = 'status-error';
                statusDiv.innerText = 'Erro de conexão. Tente novamente.';
                console.error('Erro:', error);
            });
        }
    </script>
</body>
</html>
